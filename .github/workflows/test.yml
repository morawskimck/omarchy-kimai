name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: TZ=Europe/Warsaw node --test tests/*.test.js
      - name: Manifest is valid JSON
        run: jq empty manifest.json
